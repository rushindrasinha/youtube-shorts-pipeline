name: Daily Shorts — All Channels

# Runs twice a day: 8 AM UTC (morning drop) and 6 PM UTC (evening drop)
# Each run produces 1 Short per channel across all 6 channels = 2 Shorts/day per channel

on:
  schedule:
    - cron: "0 8 * * *"   # Morning run — 8:00 AM UTC
    - cron: "0 18 * * *"  # Evening run — 6:00 PM UTC
  workflow_dispatch:        # Manual trigger from GitHub Actions UI
    inputs:
      niche:
        description: "Run a single niche only (leave blank for all channels)"
        required: false
        default: ""

jobs:
  dopamine_loop:
    name: "CH1 — Dopamine Loop"
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.niche == '' || github.event.inputs.niche == 'dopamine_loop' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system dependencies
        run: |
          printf 'Package: libcaca0\nPin: release a=noble-updates\nPin-Priority: -1\n' \
            | sudo tee /etc/apt/preferences.d/libcaca0
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Write credentials
        run: |
          mkdir -p ~/.verticals
          echo '${{ secrets.VERTICALS_CONFIG }}' > ~/.verticals/config.json
          chmod 600 ~/.verticals/config.json
          echo '${{ secrets.YOUTUBE_TOKEN_CH1 }}' > ~/.verticals/youtube_token.json
          chmod 600 ~/.verticals/youtube_token.json

      - name: Discover topic and run pipeline
        run: |
          python -m verticals run \
            --discover \
            --niche dopamine_loop \
            --auto-pick \
            --provider claude \
            --voice edge \
            --platform shorts

